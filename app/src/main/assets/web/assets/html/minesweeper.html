<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../../">
  <title>Minesweeper</title><link id="frame-style" rel="stylesheet" href="assets/css/style.css"><link id="frame-theme" rel="stylesheet" href="data:text/css,"><link rel="stylesheet" href="assets/css/control-panel.css"><link rel="stylesheet" href="assets/css/minesweeper.css">
<script src="assets/js/android-bridge.js"></script><link rel="stylesheet" href="assets/css/android.css">
</head>
<body>
  <div class="xp-window mine-window">
    <header class="xp-titlebar"><span class="xp-app-icon has-icon" style="background-image:url('assets/games/minesweeper/icon.png')"></span><span class="xp-title">Сапёр</span><div class="xp-window-controls"><button id="close" aria-label="Закрыть"></button></div></header>
    <div class="xp-body-frame"><i class="xp-side xp-side-left"></i><main class="control-panel mine-app">
      <nav class="cp-menu" id="mine-menu"><button type="button" data-menu="game"></button><button type="button" data-menu="help"></button></nav>
      <div class="mine-board-frame">
        <div class="mine-status"><span class="mine-led" id="mine-count"></span><button type="button" class="mine-face" id="mine-face" aria-label="New game"></button><span class="mine-led" id="mine-time"></span></div>
        <div class="mine-grid" id="mine-grid"></div>
      </div>
      <p class="mine-challenge" id="mine-challenge" hidden></p>
    </main><i class="xp-side xp-side-right"></i></div>
    <i class="xp-bottom"></i>
  </div>
  <script src="assets/js/packs.js"></script>
  <script src="assets/js/minesweeper.js"></script>
</body>
</html>
