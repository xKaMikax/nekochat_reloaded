<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Nekochat Reloaded</title>
  <meta name="description" content="Windows XP styled Nekochat client in the browser.">
  <meta name="theme-color" content="#0a246a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nekochat">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/nekochat_icon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="web/host.css">
</head>
<body>
  <main id="desktop"></main>
  <script src="web/aero-css.js"></script>
  <script src="web/themes.js"></script>
  <script src="web/native.js"></script>
  <script src="web/host.js"></script>
  <script>
    // Offline start and installation as an app (PWA).
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(error => console.warn('Service worker:', error));
  </script>
</body>
</html>
