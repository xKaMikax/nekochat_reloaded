<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><base href="../../"><title>Учётные записи пользователей</title>
  <link id="frame-style" rel="stylesheet" href="assets/css/style.css"><link id="frame-theme" rel="stylesheet" href="data:text/css,">
  <link rel="stylesheet" href="assets/css/control-panel.css"><link rel="stylesheet" href="assets/css/profile-settings.css">
</head>
<body>
  <div class="xp-window profile-window">
    <header class="xp-titlebar"><span class="xp-app-icon has-icon" style="background-image:url('assets/images/control-panel/users.png')"></span><span class="xp-title">Учётные записи пользователей</span><div class="xp-window-controls"><button id="close" aria-label="Закрыть"></button></div></header>
    <div class="xp-body-frame"><i class="xp-side xp-side-left"></i><main class="control-panel accounts">
      <div class="cp-toolbar accounts-toolbar">
        <button class="cp-tool cp-tool-labeled" id="ua-back" type="button" disabled><img src="assets/images/control-panel/tb-back.png" alt=""><span data-i18n="back"></span></button>
        <button class="cp-tool" id="ua-forward" type="button" disabled><img src="assets/images/control-panel/tb-forward.png" alt=""></button>
        <button class="cp-tool cp-tool-labeled" id="ua-home" type="button"><img src="assets/images/control-panel/users.png" alt=""><span data-i18n="home"></span></button>
      </div>
      <div class="cp-body">
        <aside class="cp-taskpane" id="ua-pane"></aside>
        <section class="cp-content accounts-content" id="ua-content"></section>
      </div>
    </main><i class="xp-side xp-side-right"></i></div>
    <i class="xp-bottom"></i>
  </div>
  <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input id="banner-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <script src="assets/js/packs.js"></script>
  <script src="assets/js/profile-settings.js"></script>
</body>
</html>
